name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The tool itself is Windows-only (screen capture, hotkeys, clicker),
    # so the engines and parsers are tested where they will actually run.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all modules
        run: python -m compileall -q advisor d2rlootreader tools tests main.py

      - name: Regression tests (engine, parser, planner, clicker math)
        run: python tests/test_regression.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Preset lint (dead rules never reach players)
        run: python tools/validate_presets.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Vision tests (skip cleanly when icons are not fetched)
        run: python tests/test_vision.py
        env:
          PYTHONIOENCODING: utf-8

  syntax-floor:
    # README promises Python 3.9+ — two PEP 701 f-strings once broke
    # import on <3.12 and the 3.12/3.13 matrix never noticed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Compile all modules under 3.9
        run: python -m compileall -q advisor d2rlootreader main.py
